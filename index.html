<script>

const sellerId = "343604045";
const categoryId = "MLM438172";

const proxy =
  "https://ml-proxy.aulois94.workers.dev";

async function loadProducts(){

  const container =
    document.getElementById("products");

  try{

    const url =
      `${proxy}/sites/MLM/search?seller_id=${sellerId}&category=${categoryId}`;

    const res = await fetch(url);

    const data = await res.json();

    console.log(data);

    container.innerHTML = "";

    if(!data.results){

      container.innerHTML = `
        <div class="error">
          No se encontraron productos
        </div>
      `;

      return;
    }

    data.results.forEach(product => {

      const image =
        product.thumbnail
          .replace("-I.jpg","-O.jpg");

      container.innerHTML += `

        <div class="card">

          <img src="${image}">

          <div class="info">

            <div class="title">
              ${product.title}
            </div>

            <div class="price">
              $${product.price}
            </div>

            <a
              class="btn"
              href="${product.permalink}"
              target="_blank"
            >
              Ver producto
            </a>

          </div>

        </div>

      `;
    });

  }catch(err){

    console.error(err);

    container.innerHTML = `
      <div class="error">
        Error cargando productos 😢
      </div>
    `;
  }
}

loadProducts();

</script>
