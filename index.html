<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simpson Store</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Fredoka',sans-serif;
background:#87CEEB;
background:
linear-gradient(to bottom,#7ecbff 0%,#6bbcff 40%,#5caef2 100%);
color:#111;
overflow-x:hidden;
}

/* NAVBAR */

header{
position:fixed;
top:0;
left:0;
width:100%;
z-index:999;
backdrop-filter:blur(10px);
background:rgba(255,255,255,.15);
border-bottom:1px solid rgba(255,255,255,.2);
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
display:flex;
align-items:center;
gap:12px;
font-size:2rem;
font-weight:700;
color:white;
text-shadow:0 2px 10px rgba(0,0,0,.3);
}

.logo-circle{
width:32px;
height:32px;
border-radius:50%;
background:#ffe15c;
border:4px solid #111;
}

/* HERO */

.hero{
height:700px;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:40px;
}

/* NUBES */

.cloud{
position:absolute;
background:white;
border-radius:100px;
opacity:.95;
filter:blur(1px);
animation:floatCloud linear infinite;
}

.cloud:before,
.cloud:after{
content:'';
position:absolute;
background:white;
border-radius:50%;
}

.cloud1{
width:220px;
height:70px;
top:120px;
left:-300px;
animation-duration:45s;
}

.cloud1:before{
width:80px;
height:80px;
top:-40px;
left:30px;
}

.cloud1:after{
width:110px;
height:110px;
top:-60px;
right:35px;
}

.cloud2{
width:260px;
height:80px;
top:220px;
left:-350px;
animation-duration:65s;
animation-delay:-20s;
}

.cloud2:before{
width:90px;
height:90px;
top:-45px;
left:50px;
}

.cloud2:after{
width:120px;
height:120px;
top:-70px;
right:40px;
}

.cloud3{
width:180px;
height:60px;
top:320px;
left:-250px;
animation-duration:55s;
animation-delay:-10s;
}

.cloud3:before{
width:70px;
height:70px;
top:-35px;
left:25px;
}

.cloud3:after{
width:90px;
height:90px;
top:-45px;
right:25px;
}

@keyframes floatCloud{

0%{
transform:translateX(0);
}

100%{
transform:translateX(2200px);
}

}

/* SKYLINE */

.skyline{
position:absolute;
bottom:0;
width:100%;
height:260px;
background:
url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&w=1800");
background-size:cover;
background-position:center bottom;
filter:
brightness(.45)
saturate(1.4)
blur(.5px);
opacity:.55;
}

/* OVERLAY */

.hero::after{
content:'';
position:absolute;
inset:0;
background:
linear-gradient(
to bottom,
rgba(255,255,255,.05),
rgba(0,0,0,.25)
);
}

/* HERO CONTENT */

.hero-content{
position:relative;
z-index:2;
max-width:900px;
}

.hero-badge{
display:inline-block;
background:rgba(255,255,255,.18);
backdrop-filter:blur(10px);
padding:10px 20px;
border-radius:999px;
margin-bottom:20px;
font-size:.95rem;
color:white;
border:1px solid rgba(255,255,255,.25);
}

.hero h1{
font-size:5rem;
line-height:1;
margin-bottom:20px;
color:white;
text-shadow:
0 4px 20px rgba(0,0,0,.25);
}

.hero p{
font-size:1.3rem;
color:white;
opacity:.95;
max-width:700px;
margin:auto;
line-height:1.6;
text-shadow:0 2px 10px rgba(0,0,0,.25);
}

.hero-buttons{
margin-top:35px;
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
}

.hero-btn{
padding:16px 28px;
border:none;
border-radius:16px;
font-size:1rem;
font-weight:700;
cursor:pointer;
transition:.25s;
}

.primary{
background:#fff3a0;
color:#111;
}

.secondary{
background:rgba(255,255,255,.15);
color:white;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.25);
}

.hero-btn:hover{
transform:translateY(-4px);
}

/* SEARCH */

.controls{
margin-top:-80px;
position:relative;
z-index:5;
padding:0 30px;
}

.controls-inner{
max-width:1200px;
margin:auto;
background:rgba(255,255,255,.18);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.25);
padding:25px;
border-radius:30px;
box-shadow:0 15px 40px rgba(0,0,0,.18);
}

.search{
width:100%;
padding:18px;
border:none;
border-radius:18px;
font-size:1rem;
outline:none;
margin-bottom:20px;
background:rgba(255,255,255,.8);
}

.categories{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.category-btn{
padding:12px 18px;
border:none;
border-radius:999px;
background:rgba(255,255,255,.5);
cursor:pointer;
font-weight:700;
transition:.25s;
}

.category-btn:hover,
.category-btn.active{
background:#fff3a0;
transform:translateY(-2px);
}

/* PRODUCTS */

.products{
padding:60px 30px 100px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:28px;
max-width:1400px;
margin:auto;
}

.card{
background:rgba(255,255,255,.2);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.25);
border-radius:28px;
overflow:hidden;
transition:.3s;
position:relative;
}

.card:hover{
transform:
translateY(-10px)
scale(1.01);
box-shadow:0 20px 40px rgba(0,0,0,.18);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
background:#dbefff;
}

.badge{
position:absolute;
top:18px;
left:18px;
padding:8px 14px;
border-radius:999px;
background:#ff7b7b;
color:white;
font-size:.8rem;
font-weight:700;
box-shadow:0 5px 12px rgba(0,0,0,.15);
}

.favorite{
position:absolute;
top:18px;
right:18px;
width:42px;
height:42px;
border-radius:50%;
background:rgba(255,255,255,.25);
backdrop-filter:blur(10px);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:1.1rem;
}

.card-content{
padding:22px;
}

.category{
font-size:.9rem;
opacity:.7;
margin-bottom:10px;
}

.card h3{
font-size:1.3rem;
margin-bottom:12px;
min-height:58px;
}

.price{
font-size:2rem;
font-weight:700;
margin-bottom:18px;
color:#111;
}

.card-buttons{
display:flex;
gap:10px;
}

.btn{
flex:1;
padding:14px;
border:none;
border-radius:14px;
font-weight:700;
cursor:pointer;
transition:.25s;
}

.buy{
background:#fff3a0;
}

.view{
background:rgba(255,255,255,.45);
}

.btn:hover{
transform:translateY(-2px);
}

/* CART */

.cart-btn{
position:fixed;
bottom:30px;
right:30px;
width:75px;
height:75px;
border-radius:50%;
background:#fff3a0;
display:flex;
align-items:center;
justify-content:center;
font-size:2rem;
cursor:pointer;
box-shadow:0 15px 35px rgba(0,0,0,.2);
z-index:999;
}

.cart-count{
position:absolute;
top:-5px;
right:-5px;
width:30px;
height:30px;
border-radius:50%;
background:#ff6b6b;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:.85rem;
font-weight:700;
}

.cart{
position:fixed;
top:0;
right:-420px;
width:420px;
height:100vh;
background:white;
z-index:1000;
transition:.35s;
padding:25px;
overflow-y:auto;
box-shadow:-10px 0 30px rgba(0,0,0,.15);
}

.cart.open{
right:0;
}

.cart h2{
margin-bottom:25px;
}

.cart-item{
display:flex;
gap:12px;
margin-bottom:16px;
background:#f5f8ff;
padding:10px;
border-radius:16px;
}

.cart-item img{
width:70px;
height:70px;
object-fit:cover;
border-radius:12px;
}

.total{
font-size:1.6rem;
font-weight:700;
margin-top:25px;
}

.checkout{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:#25D366;
color:white;
font-weight:700;
margin-top:20px;
cursor:pointer;
}

/* FOOTER */

footer{
padding:50px;
text-align:center;
color:white;
opacity:.9;
}

/* MOBILE */

@media(max-width:900px){

.hero h1{
font-size:3rem;
}

.hero{
height:600px;
}

header{
padding:16px 20px;
}

.products{
padding:50px 20px 100px;
}

.cart{
width:100%;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
<div class="logo-circle"></div>
Simpson Store
</div>

</header>

<section class="hero">

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<div class="skyline"></div>

<div class="hero-content">

<div class="hero-badge">
✨ Coleccionables Premium
</div>

<h1>
Bienvenido a Springfield
</h1>

<p>
Juguetes, figuras, peluches y coleccionables únicos con estilo caricatura premium.
</p>

<div class="hero-buttons">

<button class="hero-btn primary">
Explorar tienda
</button>

<button class="hero-btn secondary">
Ver novedades
</button>

</div>

</div>

</section>

<section class="controls">

<div class="controls-inner">

<input
type="text"
class="search"
placeholder="Buscar producto..."
id="search"
/>

<div class="categories" id="categories"></div>

</div>

</section>

<section class="products" id="products"></section>

<div class="cart-btn" onclick="toggleCart()">
🛒
<div class="cart-count" id="cartCount">0</div>
</div>

<div class="cart" id="cart">

<h2>Tu carrito</h2>

<div id="cartItems"></div>

<div class="total" id="total">
Total: $0
</div>

<button class="checkout" onclick="checkout()">
Pedir por WhatsApp
</button>

</div>

<footer>
Simpson Store © 2026
</footer>

<script>

const PRODUCTS = [

{
id:1,
name:"Figura Bart Simpson",
price:599,
category:"Juguetes",
image:"https://picsum.photos/600/600?1",
link:"#",
badge:"HOT"
},

{
id:2,
name:"Peluche Homero",
price:799,
category:"Peluches",
image:"https://picsum.photos/600/600?2",
link:"#",
badge:"NUEVO"
},

{
id:3,
name:"Figura Lisa Simpson",
price:650,
category:"Coleccionables",
image:"https://picsum.photos/600/600?3",
link:"#"
},

{
id:4,
name:"Muñeco Krusty",
price:720,
category:"Figuras",
image:"https://picsum.photos/600/600?4",
link:"#"
}

];

let cart = [];

const productsContainer =
document.getElementById("products");

const categoriesContainer =
document.getElementById("categories");

const searchInput =
document.getElementById("search");

function renderProducts(products){

productsContainer.innerHTML="";

products.forEach(product=>{

productsContainer.innerHTML += `

<div class="card">

${product.badge ? `
<div class="badge">
${product.badge}
</div>
` : ""}

<div class="favorite">
❤️
</div>

<img src="${product.image}">

<div class="card-content">

<div class="category">
${product.category}
</div>

<h3>
${product.name}
</h3>

<div class="price">
$${product.price}
</div>

<div class="card-buttons">

<button
class="btn buy"
onclick="addToCart(${product.id})"
>
Agregar
</button>

<a
href="${product.link}"
target="_blank"
style="flex:1;"
>

<button class="btn view">
Ver
</button>

</a>

</div>

</div>

</div>

`;

});

}

function renderCategories(){

const categories =
[...new Set(PRODUCTS.map(p=>p.category))];

categoriesContainer.innerHTML = `
<button
class="category-btn active"
onclick="filterCategory('Todos',this)"
>
Todos
</button>
`;

categories.forEach(cat=>{

categoriesContainer.innerHTML += `
<button
class="category-btn"
onclick="filterCategory('${cat}',this)"
>
${cat}
</button>
`;

});

}

function filterCategory(category,btn){

document
.querySelectorAll(".category-btn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

if(category==="Todos"){
renderProducts(PRODUCTS);
return;
}

renderProducts(
PRODUCTS.filter(
p=>p.category===category
)
);

}

searchInput.addEventListener("input",e=>{

const term =
e.target.value.toLowerCase();

renderProducts(
PRODUCTS.filter(p=>
p.name.toLowerCase().includes(term)
)
);

});

function addToCart(id){

const product =
PRODUCTS.find(p=>p.id===id);

cart.push(product);

updateCart();

}

function updateCart(){

document.getElementById("cartCount")
.innerText = cart.length;

const cartItems =
document.getElementById("cartItems");

cartItems.innerHTML="";

let total = 0;

cart.forEach(item=>{

total += item.price;

cartItems.innerHTML += `

<div class="cart-item">

<img src="${item.image}">

<div>

<h4>${item.name}</h4>

<p>$${item.price}</p>

</div>

</div>

`;

});

document.getElementById("total")
.innerText = "Total: $" + total;

}

function toggleCart(){

document.getElementById("cart")
.classList.toggle("open");

}

function checkout(){

if(cart.length===0){
alert("Tu carrito está vacío");
return;
}

let message =
"Hola, quiero pedir:%0A%0A";

cart.forEach(item=>{

message +=
`• ${item.name} - $${item.price}%0A`;

});

window.open(
`https://wa.me/5210000000000?text=${message}`,
"_blank"
);

}

renderProducts(PRODUCTS);
renderCategories();

</script>

</body>
</html>
