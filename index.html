<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simpson Store</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f0f0f;
font-family:'Montserrat',sans-serif;
color:white;
overflow-x:hidden;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:999;
background:#121212;
border-bottom:4px solid #ffd90f;
padding:18px 5%;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
}

.logo{
font-family:'Luckiest Guy',cursive;
font-size:2rem;
color:#ffd90f;
letter-spacing:2px;
}

.search-box{
display:flex;
align-items:center;
background:#1d1d1d;
padding:10px 15px;
border-radius:14px;
width:320px;
max-width:100%;
border:2px solid #2b2b2b;
}

.search-box input{
background:transparent;
border:none;
outline:none;
color:white;
width:100%;
font-size:15px;
}

.search-box input::placeholder{
color:#999;
}

/* HERO */

.hero{
padding:80px 5%;
text-align:center;
background:
linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1400&auto=format&fit=crop');
background-size:cover;
background-position:center;
border-bottom:5px solid #ffd90f;
}

.hero h1{
font-family:'Luckiest Guy',cursive;
font-size:4rem;
color:#ffd90f;
margin-bottom:20px;
text-shadow:4px 4px 0px #000;
}

.hero p{
font-size:1.2rem;
max-width:700px;
margin:auto;
line-height:1.6;
color:#ddd;
}

/* FILTERS */

.filters{
padding:25px 5%;
display:flex;
gap:12px;
flex-wrap:wrap;
justify-content:center;
}

.filter-btn{
background:#1f1f1f;
border:2px solid #ffd90f;
color:#ffd90f;
padding:10px 18px;
border-radius:12px;
cursor:pointer;
font-weight:700;
transition:.25s;
}

.filter-btn:hover{
background:#ffd90f;
color:#000;
transform:translateY(-2px);
}

/* PRODUCTS */

.products{
padding:20px 5% 60px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:28px;
}

.card{
background:#181818;
border-radius:22px;
overflow:hidden;
border:3px solid #2a2a2a;
transition:.3s;
position:relative;
}

.card:hover{
transform:translateY(-8px) scale(1.02);
border-color:#ffd90f;
box-shadow:0 12px 30px rgba(255,217,15,.18);
}

.card img{
width:100%;
height:300px;
object-fit:cover;
background:#111;
}

.card-content{
padding:18px;
}

.category{
display:inline-block;
background:#ffd90f;
color:#000;
font-size:.8rem;
padding:6px 12px;
border-radius:999px;
font-weight:700;
margin-bottom:12px;
}

.title{
font-size:1.1rem;
font-weight:700;
margin-bottom:12px;
line-height:1.4;
min-height:52px;
}

.price{
font-size:1.7rem;
font-weight:800;
color:#ffd90f;
margin-bottom:18px;
}

.actions{
display:flex;
gap:10px;
}

.btn{
flex:1;
text-align:center;
padding:12px;
border-radius:12px;
font-weight:700;
text-decoration:none;
transition:.25s;
}

.btn-primary{
background:#ffd90f;
color:#000;
}

.btn-primary:hover{
background:white;
}

.btn-secondary{
background:#252525;
color:white;
border:2px solid #333;
}

.btn-secondary:hover{
border-color:#ffd90f;
color:#ffd90f;
}

/* FOOTER */

footer{
padding:35px;
text-align:center;
background:#121212;
border-top:4px solid #ffd90f;
color:#999;
}

/* MOBILE */

@media(max-width:768px){

.hero h1{
font-size:2.5rem;
}

.hero p{
font-size:1rem;
}

.logo{
font-size:1.6rem;
}

}

</style>
</head>
<body>

<header>

<div class="logo">
🟡 Simpson Store
</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Buscar coleccionables...">
</div>

</header>

<section class="hero">

<h1>
Coleccionables de Springfield
</h1>

<p>
Figuras, peluches, juguetes, coleccionables y artículos únicos para fans reales de Los Simpsons.
</p>

</section>

<div class="filters" id="filters">
<button class="filter-btn" onclick="filterProducts('Todos')">
Todos
</button>
</div>

<section class="products" id="products"></section>

<footer>
Simpson Store © 2026
</footer>

<script>

/* =========================
   PRODUCTOS
========================= */

const PRODUCTS = [

{
title:"Figura Bart Simpson",
price:799,
category:"Figuras",
image:"https://picsum.photos/500/500?1",
link:"#"
},

{
title:"Peluche Homero Simpson",
price:599,
category:"Peluches",
image:"https://picsum.photos/500/500?2",
link:"#"
},

{
title:"Funko Pop Lisa Simpson",
price:899,
category:"Funkos",
image:"https://picsum.photos/500/500?3",
link:"#"
},

{
title:"Figura Krusty Deluxe",
price:1299,
category:"Coleccionables",
image:"https://picsum.photos/500/500?4",
link:"#"
}

];

/* =========================
   VARIABLES
========================= */

const productsContainer=document.getElementById("products");
const filtersContainer=document.getElementById("filters");
const searchInput=document.getElementById("searchInput");

/* =========================
   RENDER
========================= */

function renderProducts(items){

productsContainer.innerHTML="";

if(items.length===0){

productsContainer.innerHTML=`
<h2>
No se encontraron productos 😢
</h2>
`;

return;

}

items.forEach(product=>{

productsContainer.innerHTML+=`

<div class="card">

<img src="${product.image}" alt="${product.title}">

<div class="card-content">

<div class="category">
${product.category}
</div>

<div class="title">
${product.title}
</div>

<div class="price">
$${product.price}
</div>

<div class="actions">

<a href="${product.link}"
target="_blank"
class="btn btn-primary">

Ver producto

</a>

<a href="https://wa.me/"
target="_blank"
class="btn btn-secondary">

WhatsApp

</a>

</div>

</div>

</div>

`;

});

}

/* =========================
   CATEGORIAS
========================= */

function generateFilters(){

const categories=[
"Todos",
...new Set(PRODUCTS.map(p=>p.category))
];

filtersContainer.innerHTML="";

categories.forEach(cat=>{

filtersContainer.innerHTML+=`

<button class="filter-btn"
onclick="filterProducts('${cat}')">

${cat}

</button>

`;

});

}

function filterProducts(category){

if(category==="Todos"){

renderProducts(PRODUCTS);

return;

}

const filtered=PRODUCTS.filter(
p=>p.category===category
);

renderProducts(filtered);

}

/* =========================
   SEARCH
========================= */

searchInput.addEventListener("input",e=>{

const value=e.target.value.toLowerCase();

const filtered=PRODUCTS.filter(product=>

product.title.toLowerCase().includes(value) ||
product.category.toLowerCase().includes(value)

);

renderProducts(filtered);

});

/* =========================
   INIT
========================= */

generateFilters();
renderProducts(PRODUCTS);

</script>

</body>
</html>
