<script>

const proxy =
  "https://ml-proxy.aulois94.workers.dev";

const items = [

"MLM2955099509",
"MLM2398082435",
"MLM3538153900",
"MLM3538103502",
"MLM3696902030",
"MLM2461878155"

];

async function loadProducts(){

  const container =
    document.getElementById("products");

  container.innerHTML = `
    <div class="loading">
      Cargando juguetes...
    </div>
  `;

  try{

    const products = await Promise.all(

      items.map(async id => {

        const res = await fetch(
          `${proxy}/items/${id}`
        );

        return await res.json();

      })

    );

    container.innerHTML = "";

    products.forEach(product => {

      const image =
        product.pictures?.[0]?.secure_url
        || product.thumbnail;

      container.innerHTML += `

        <div class="card">

          <img src="${image}">

          <div class="info">

            <div class="title">
              ${product.title}
            </div>

            <div class="price">
              $${product.price}
            </div>

            <a
              class="btn"
              href="${product.permalink}"
              target="_blank"
            >
              Ver producto
            </a>

          </div>

        </div>

      `;
    });

  }catch(err){

    console.error(err);

    container.innerHTML = `
      <div class="error">
        Error cargando productos 😢
      </div>
    `;
  }
}

loadProducts();

</script>
