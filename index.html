<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Simpson Store</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Fredoka',sans-serif;
background:#0f0f0f;
color:white;
overflow-x:hidden;
}

header{
background:linear-gradient(90deg,#ffd90f,#ffb300);
padding:25px;
text-align:center;
color:#111;
box-shadow:0 4px 20px rgba(0,0,0,.4);
position:sticky;
top:0;
z-index:999;
}

header h1{
font-size:3rem;
}

header p{
font-size:1.1rem;
margin-top:5px;
}

.hero{
height:350px;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.7)),
url('https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1600');
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

.hero-content h2{
font-size:3rem;
color:#ffd90f;
margin-bottom:15px;
}

.hero-content p{
font-size:1.2rem;
max-width:700px;
margin:auto;
opacity:.9;
}

.controls{
padding:25px;
display:flex;
flex-wrap:wrap;
gap:15px;
justify-content:center;
background:#151515;
border-bottom:1px solid #222;
}

.search{
padding:14px;
width:300px;
border:none;
border-radius:14px;
background:#222;
color:white;
font-size:1rem;
outline:none;
}

.category-btn{
padding:12px 20px;
border:none;
border-radius:14px;
background:#222;
color:white;
cursor:pointer;
font-weight:bold;
transition:.25s;
}

.category-btn:hover,
.category-btn.active{
background:#ffd90f;
color:#111;
transform:translateY(-2px);
}

.products{
padding:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:28px;
}

.card{
background:#181818;
border-radius:22px;
overflow:hidden;
position:relative;
transition:.3s;
border:1px solid #2b2b2b;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.card img{
width:100%;
height:270px;
object-fit:cover;
background:#111;
}

.badge{
position:absolute;
top:15px;
left:15px;
background:#ff4757;
padding:6px 12px;
border-radius:50px;
font-size:.8rem;
font-weight:bold;
}

.favorite{
position:absolute;
top:15px;
right:15px;
background:rgba(0,0,0,.6);
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
cursor:pointer;
font-size:1.2rem;
transition:.2s;
}

.favorite:hover{
transform:scale(1.1);
}

.card-content{
padding:20px;
}

.card h3{
font-size:1.2rem;
margin-bottom:10px;
min-height:60px;
}

.category{
font-size:.9rem;
opacity:.7;
margin-bottom:10px;
}

.price{
font-size:1.7rem;
font-weight:bold;
color:#ffd90f;
margin-bottom:15px;
}

.card-buttons{
display:flex;
gap:10px;
}

.btn{
flex:1;
padding:12px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
transition:.25s;
}

.buy{
background:#ffd90f;
color:#111;
}

.buy:hover{
transform:scale(1.03);
}

.view{
background:#222;
color:white;
}

.cart-btn{
position:fixed;
bottom:25px;
right:25px;
background:#ffd90f;
color:#111;
width:70px;
height:70px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:2rem;
cursor:pointer;
box-shadow:0 10px 30px rgba(0,0,0,.5);
z-index:999;
}

.cart-count{
position:absolute;
top:-5px;
right:-5px;
background:#ff4757;
color:white;
width:28px;
height:28px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:.9rem;
font-weight:bold;
}

.cart{
position:fixed;
top:0;
right:-420px;
width:420px;
height:100vh;
background:#121212;
z-index:1000;
transition:.35s;
padding:25px;
overflow-y:auto;
border-left:1px solid #333;
}

.cart.open{
right:0;
}

.cart h2{
margin-bottom:20px;
color:#ffd90f;
}

.cart-item{
display:flex;
gap:15px;
margin-bottom:20px;
background:#1d1d1d;
padding:10px;
border-radius:14px;
}

.cart-item img{
width:70px;
height:70px;
object-fit:cover;
border-radius:10px;
}

.total{
font-size:1.6rem;
margin-top:25px;
font-weight:bold;
}

.checkout{
width:100%;
padding:15px;
border:none;
border-radius:14px;
margin-top:20px;
background:#25D366;
color:white;
font-size:1rem;
font-weight:bold;
cursor:pointer;
}

footer{
padding:40px;
text-align:center;
opacity:.6;
}

@media(max-width:700px){

header h1{
font-size:2rem;
}

.hero{
height:280px;
}

.hero-content h2{
font-size:2rem;
}

.cart{
width:100%;
}

.products{
padding:20px;
}

}

</style>
</head>

<body>

<header>
<h1>🟡 Simpson Store</h1>
<p>Juguetes, coleccionables, peluches y artículos únicos</p>
</header>

<section class="hero">
<div class="hero-content">
<h2>Bienvenido a Springfield</h2>
<p>
Encuentra juguetes, figuras, peluches y coleccionables con estilo premium.
</p>
</div>
</section>

<section class="controls">

<input
type="text"
class="search"
placeholder="Buscar producto..."
id="search"
/>

<div id="categories"></div>

</section>

<section class="products" id="products"></section>

<div class="cart-btn" onclick="toggleCart()">
🛒
<div class="cart-count" id="cartCount">0</div>
</div>

<div class="cart" id="cart">

<h2>Tu carrito</h2>

<div id="cartItems"></div>

<div class="total" id="total">
Total: $0
</div>

<button class="checkout" onclick="checkout()">
Pedir por WhatsApp
</button>

</div>

<footer>
Simpson Store © 2026
</footer>

<script>

const PRODUCTS = [

{
id:1,
name:"Figura Bart Simpson",
price:599,
category:"Juguetes",
image:"https://i.imgur.com/2nCt3Sbl.jpg",
link:"#",
badge:"HOT"
},

{
id:2,
name:"Peluche Homero",
price:799,
category:"Peluches",
image:"https://i.imgur.com/tGbaZCY.jpg",
link:"#",
badge:"NUEVO"
},

{
id:3,
name:"Figura Lisa Simpson",
price:650,
category:"Coleccionables",
image:"https://i.imgur.com/WCzJDWpl.jpg",
link:"#"
},

{
id:4,
name:"Muñeco Krusty",
price:720,
category:"Juguetes",
image:"https://i.imgur.com/1n7fK6M.jpg",
link:"#"
},

];

let cart = [];

const productsContainer = document.getElementById("products");
const searchInput = document.getElementById("search");
const categoriesContainer = document.getElementById("categories");

function renderProducts(products){

productsContainer.innerHTML="";

products.forEach(product=>{

productsContainer.innerHTML += `
<div class="card">

${product.badge ? `<div class="badge">${product.badge}</div>` : ""}

<div class="favorite">❤️</div>

<img src="${product.image}">

<div class="card-content">

<div class="category">${product.category}</div>

<h3>${product.name}</h3>

<div class="price">$${product.price}</div>

<div class="card-buttons">

<button class="btn buy" onclick="addToCart(${product.id})">
Agregar
</button>

<a href="${product.link}" target="_blank" style="flex:1;">
<button class="btn view">
Ver
</button>
</a>

</div>

</div>
</div>
`;

});

}

function renderCategories(){

const categories = [...new Set(PRODUCTS.map(p=>p.category))];

categoriesContainer.innerHTML = `
<button class="category-btn active" onclick="filterCategory('Todos', this)">
Todos
</button>
`;

categories.forEach(cat=>{

categoriesContainer.innerHTML += `
<button class="category-btn" onclick="filterCategory('${cat}', this)">
${cat}
</button>
`;

});

}

function filterCategory(category,btn){

document.querySelectorAll(".category-btn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

if(category==="Todos"){
renderProducts(PRODUCTS);
return;
}

renderProducts(
PRODUCTS.filter(p=>p.category===category)
);

}

searchInput.addEventListener("input",e=>{

const term = e.target.value.toLowerCase();

renderProducts(
PRODUCTS.filter(p=>
p.name.toLowerCase().includes(term)
)
);

});

function addToCart(id){

const product = PRODUCTS.find(p=>p.id===id);

cart.push(product);

updateCart();

}

function updateCart(){

document.getElementById("cartCount").innerText = cart.length;

const cartItems = document.getElementById("cartItems");

cartItems.innerHTML="";

let total = 0;

cart.forEach(item=>{

total += item.price;

cartItems.innerHTML += `
<div class="cart-item">
<img src="${item.image}">
<div>
<h4>${item.name}</h4>
<p>$${item.price}</p>
</div>
</div>
`;

});

document.getElementById("total").innerText =
"Total: $" + total;

}

function toggleCart(){
document.getElementById("cart")
.classList.toggle("open");
}

function checkout(){

if(cart.length===0){
alert("Tu carrito está vacío");
return;
}

let message = "Hola, quiero pedir:%0A%0A";

cart.forEach(item=>{
message += `• ${item.name} - $${item.price}%0A`;
});

window.open(
`https://wa.me/5210000000000?text=${message}`,
"_blank"
);

}

renderProducts(PRODUCTS);
renderCategories();

</script>

</body>
</html>
