<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpson Store MX — Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFD500;
    --blue: #1565C0;
    --blue-light: #1E88E5;
    --sky: #87CEEB;
    --black: #1A1A1A;
    --card-radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--sky); min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 120px 55px at 10% 12%, rgba(255,255,255,0.7) 0%, transparent 70%),
      radial-gradient(ellipse 80px 38px at 7% 9%,  rgba(255,255,255,0.45) 0%, transparent 70%),
      radial-gradient(ellipse 100px 48px at 38% 7%, rgba(255,255,255,0.65) 0%, transparent 70%),
      radial-gradient(ellipse 140px 58px at 72% 15%, rgba(255,255,255,0.6) 0%, transparent 70%),
      radial-gradient(ellipse 90px 42px at 90% 9%,  rgba(255,255,255,0.55) 0%, transparent 70%);
  }
  header { background: var(--yellow); border-bottom: 4px solid var(--black); position: relative; z-index: 10; padding: 0 1.5rem; }
  .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 1rem 0; gap: 1rem; flex-wrap: wrap; }
  .logo { font-family: 'Bangers', cursive; font-size: 2.4rem; letter-spacing: 2px; color: var(--blue); text-shadow: 3px 3px 0 var(--black); line-height: 1; text-decoration: none; }
  .logo span { color: var(--black); }
  .search-bar { flex: 1; max-width: 420px; display: flex; border: 3px solid var(--black); border-radius: 50px; overflow: hidden; background: white; }
  .search-bar input { flex: 1; padding: 0.55rem 1rem; border: none; outline: none; font-family: 'Nunito', sans-serif; font-size: 0.9rem; }
  .search-bar button { background: var(--blue); color: white; border: none; padding: 0.55rem 1.1rem; cursor: pointer; font-size: 1rem; }
  .header-badge { background: var(--blue); color: white; font-family: 'Bangers', cursive; font-size: 1rem; letter-spacing: 1px; padding: 0.4rem 1rem; border-radius: 50px; border: 2px solid var(--black); white-space: nowrap; }
  main { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .stats-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
  .stats-bar h2 { font-family: 'Bangers', cursive; font-size: 1.6rem; color: var(--black); letter-spacing: 1px; }
  .stats-bar span { font-size: 0.85rem; color: #444; font-weight: 600; }
  .filters { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .filter-btn { background: white; border: 2.5px solid var(--black); border-radius: 50px; padding: 0.35rem 1rem; font-family: 'Nunito', sans-serif; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover, .filter-btn.active { background: var(--yellow); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.25rem; }
  .card { background: white; border: 3px solid var(--black); border-radius: var(--card-radius); overflow: hidden; transition: transform 0.18s, box-shadow 0.18s; cursor: pointer; position: relative; display: flex; flex-direction: column; box-shadow: 4px 4px 0 var(--black); text-decoration: none; color: inherit; }
  .card:hover { transform: translateY(-4px) translateX(-2px); box-shadow: 6px 8px 0 var(--black); }
  .card-img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #FFFDE7; padding: 1rem; display: block; border-bottom: 2.5px solid var(--black); }
  .card-img-placeholder { width: 100%; aspect-ratio: 1; background: #FFFDE7; border-bottom: 2.5px solid var(--black); display: flex; align-items: center; justify-content: center; font-size: 3rem; }
  .card-body { padding: 0.85rem 1rem 1rem; flex: 1; display: flex; flex-direction: column; gap: 0.4rem; }
  .card-title { font-size: 0.88rem; font-weight: 700; color: var(--black); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-price { font-family: 'Bangers', cursive; font-size: 1.5rem; letter-spacing: 1px; color: var(--blue); }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 0.5rem; }
  .badge-shipping { background: #E8F5E9; color: #2E7D32; font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 50px; border: 1.5px solid #2E7D32; }
  .badge-condition { background: #E3F2FD; color: var(--blue); font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 50px; border: 1.5px solid var(--blue); }
  .card-sold { font-size: 0.75rem; color: #888; font-weight: 600; }
  .badge-top { position: absolute; top: 0.6rem; left: 0.6rem; background: var(--yellow); border: 2px solid var(--black); border-radius: 6px; font-family: 'Bangers', cursive; font-size: 0.82rem; letter-spacing: 0.5px; padding: 0.1rem 0.5rem; z-index: 2; }
  .skeleton { background: white; border: 3px solid var(--black); border-radius: var(--card-radius); overflow: hidden; box-shadow: 4px 4px 0 var(--black); }
  .skeleton-img { width: 100%; aspect-ratio: 1; background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-bottom: 2.5px solid var(--black); }
  .skeleton-line { height: 14px; border-radius: 6px; margin: 8px 14px; background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  .skeleton-line.short { width: 50%; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .error-box { background: white; border: 3px solid var(--black); border-radius: var(--card-radius); padding: 2.5rem 2rem; text-align: center; box-shadow: 4px 4px 0 var(--black); grid-column: 1/-1; }
  .error-box .emoji { font-size: 3rem; margin-bottom: 0.75rem; }
  .error-box h3 { font-family: 'Bangers', cursive; font-size: 1.6rem; letter-spacing: 1px; margin-bottom: 0.5rem; }
  .error-box p { color: #666; font-size: 0.9rem; line-height: 1.5; }
  .error-box code { display: block; background: #f5f5f5; border-radius: 8px; padding: 0.5rem 0.75rem; margin-top: 0.75rem; font-size: 0.78rem; text-align: left; word-break: break-all; }
  .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 2.5rem; flex-wrap: wrap; }
  .page-btn { background: white; border: 2.5px solid var(--black); border-radius: 8px; padding: 0.5rem 1rem; font-family: 'Bangers', cursive; font-size: 1rem; letter-spacing: 1px; cursor: pointer; transition: all 0.15s; box-shadow: 3px 3px 0 var(--black); }
  .page-btn:hover:not(:disabled), .page-btn.active { background: var(--yellow); transform: translateY(-1px); }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  footer { background: var(--blue); color: white; text-align: center; padding: 1.5rem; font-size: 0.85rem; position: relative; z-index: 10; border-top: 4px solid var(--black); }
  footer a { color: var(--yellow); font-weight: 700; text-decoration: none; }
  @media (max-width: 600px) { .logo { font-size: 1.8rem; } .header-badge { display: none; } .search-bar { max-width: 100%; } main { padding: 1.25rem 1rem 3rem; } }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="#" class="logo">Simpson<span>Store</span></a>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar productos..." oninput="filterLocal(this.value)">
      <button>🔍</button>
    </div>
    <div class="header-badge">⭐ Tienda Oficial MX</div>
  </div>
</header>
<main>
  <div class="stats-bar">
    <h2 id="section-title">🍩 Todos los productos</h2>
    <span id="total-count"></span>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">Todos</button>
    <button class="filter-btn" onclick="setFilter('new',this)">Nuevos</button>
    <button class="filter-btn" onclick="setFilter('free_shipping',this)">Envío gratis</button>
    <button class="filter-btn" onclick="setFilter('price_asc',this)">Menor precio</button>
    <button class="filter-btn" onclick="setFilter('price_desc',this)">Mayor precio</button>
  </div>
  <div id="grid-container" class="grid"></div>
  <div class="pagination" id="pagination"></div>
</main>
<footer>
  <p>Powered by <a href="https://www.mercadolibre.com.mx" target="_blank">Mercado Libre</a> · Simpson Store MX</p>
</footer>

<script>
// ─── CONFIGURACIÓN ────────────────────────────────────────────────────────────
const SELLER_ID  = '343604045';
const PAGE_SIZE  = 20;
// Pega aquí tu API key de Anthropic (console.anthropic.com → API Keys)
const ANTHROPIC_KEY = ';
// ─────────────────────────────────────────────────────────────────────────────

let allItems = [], filtered = [], currentPage = 0, activeFilter = 'all', searchQuery = '';

// Usa Claude como proxy: le pedimos que haga fetch a ML y nos regrese JSON limpio
async function fetchProducts(offset = 0, filter = 'all') {
  const sortParam   = ['price_asc','price_desc'].includes(filter) ? `&sort=${filter}` : '';
  const condParam   = filter === 'new'           ? '&condition=new'          : '';
  const shipParam   = filter === 'free_shipping' ? '&shipping_cost=free'     : '';
  const mlUrl = `https://api.mercadolibre.com/sites/MLM/search?seller_id=${SELLER_ID}&limit=${PAGE_SIZE}&offset=${offset}${sortParam}${condParam}${shipParam}`;

  const prompt = `Haz un GET a esta URL y devuelve SOLO el JSON crudo sin ningún texto adicional, sin markdown, sin explicación:\n${mlUrl}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': ANTHROPIC_KEY,
      'anthropic-version': '2023-06-01',
      'anthropic-beta': 'interleaved-thinking-2025-05-14'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 8000,
      tools: [{ type: 'web_search_20250305', name: 'web_search' }],
      messages: [{ role: 'user', content: prompt }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${res.status}`);
  }

  const data = await res.json();
  // Extrae el texto de la respuesta
  const text = data.content
    .filter(b => b.type === 'text')
    .map(b => b.text)
    .join('');

  // Limpia posibles backticks de markdown
  const clean = text.replace(/```json|```/g, '').trim();
  const json = JSON.parse(clean);
  if (!json.results) throw new Error('Respuesta inesperada de la API');
  return json;
}

function formatPrice(price) {
  const [int, dec] = price.toFixed(2).split('.');
  return '$' + int.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + `<span style="font-size:1rem;vertical-align:super">.${dec}</span>`;
}

function renderCards(items) {
  const grid = document.getElementById('grid-container');
  if (!items.length) {
    grid.innerHTML = `<div class="error-box"><div class="emoji">🍩</div><h3>¡D'oh! Sin resultados</h3><p>No encontramos productos con ese filtro.</p></div>`;
    return;
  }
  grid.innerHTML = items.map(item => {
    const freeShip = item.shipping?.free_shipping;
    const condition = item.condition === 'new' ? 'Nuevo' : 'Usado';
    const sold = item.sold_quantity > 0 ? `${item.sold_quantity} vendidos` : '';
    const thumb = item.thumbnail?.replace('http:','https:').replace('-I.jpg','-O.jpg') || '';
    return `<a class="card" href="${item.permalink}" target="_blank" rel="noopener">
      ${item.condition === 'new' ? '<span class="badge-top">NUEVO</span>' : ''}
      ${thumb ? `<img class="card-img" src="${thumb}" alt="${item.title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
      <div class="card-img-placeholder" ${thumb ? 'style="display:none"' : ''}>🛒</div>
      <div class="card-body">
        <div class="card-title">${item.title}</div>
        <div class="card-price">${formatPrice(item.price)}</div>
        <div class="card-footer">
          <div style="display:flex;gap:5px;flex-wrap:wrap">
            ${freeShip ? '<span class="badge-shipping">Envío gratis</span>' : ''}
            <span class="badge-condition">${condition}</span>
          </div>
          ${sold ? `<span class="card-sold">${sold}</span>` : ''}
        </div>
      </div>
    </a>`;
  }).join('');
}

function renderSkeletons(n=8) {
  document.getElementById('grid-container').innerHTML = Array(n).fill(`
    <div class="skeleton">
      <div class="skeleton-img"></div>
      <div class="skeleton-line" style="margin-top:14px"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line short"></div>
    </div>`).join('');
}

function renderPagination(total) {
  const pages = Math.min(Math.ceil(total / PAGE_SIZE), 8);
  const pag = document.getElementById('pagination');
  if (pages <= 1) { pag.innerHTML = ''; return; }
  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Ant</button>`;
  for (let i = 0; i < pages; i++)
    html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i+1}</button>`;
  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage>=pages-1?'disabled':''}>Sig →</button>`;
  pag.innerHTML = html;
}

async function loadPage(page=0) {
  currentPage = page;
  renderSkeletons();
  document.getElementById('pagination').innerHTML = '';
  try {
    const data = await fetchProducts(page * PAGE_SIZE, activeFilter);
    allItems = data.results || [];
    const total = data.paging?.total || 0;
    document.getElementById('total-count').textContent = `${total.toLocaleString('es-MX')} productos`;
    applyLocalFilter();
    renderPagination(total);
  } catch(e) {
    document.getElementById('grid-container').innerHTML = `
      <div class="error-box">
        <div class="emoji">😱</div>
        <h3>¡Ay, caramba!</h3>
        <p>No se pudo cargar. Verifica que tu API key de Anthropic esté correcta en el archivo.</p>
        <code>${e.message}</code>
      </div>`;
  }
}

function applyLocalFilter() {
  const q = searchQuery.toLowerCase().trim();
  filtered = q ? allItems.filter(i => i.title.toLowerCase().includes(q)) : [...allItems];
  renderCards(filtered);
}

function filterLocal(q) { searchQuery = q; applyLocalFilter(); }

function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const labels = { all:'🍩 Todos los productos', new:'✨ Nuevos', free_shipping:'🚚 Envío gratis', price_asc:'💰 Menor precio', price_desc:'💎 Mayor precio' };
  document.getElementById('section-title').textContent = labels[filter] || '🍩 Todos';
  loadPage(0);
}

function goPage(page) { window.scrollTo({top:0,behavior:'smooth'}); loadPage(page); }

loadPage(0);
</script>
</body>
</html>
