<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpson Store</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
}

header{
  background:#FFD90F;
  color:#111;
  padding:20px;
  text-align:center;
  font-size:32px;
  font-weight:bold;
}

#products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1c1c1c;
  border-radius:14px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  background:#222;
}

.info{
  padding:15px;
}

.title{
  font-size:15px;
  min-height:50px;
}

.price{
  font-size:24px;
  font-weight:bold;
  margin:10px 0;
  color:#00e676;
}

.btn{
  display:block;
  background:#FFD90F;
  color:#111;
  text-align:center;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
🟡 Simpson Store
</header>

<div id="products"></div>

<script>

const sellerId = "343604045";

async function loadProducts(){

  const container = document.getElementById("products");

  container.innerHTML = "<h2>Cargando juguetes...</h2>";

  try{

    const res = await fetch(
      `https://api.allorigins.win/raw?url=${
        encodeURIComponent(
          `https://api.mercadolibre.com/sites/MLM/search?seller_id=${sellerId}&category=MLM438172`
        )
      }`
    );

    const data = await res.json();

    container.innerHTML = "";

    data.results.forEach(product => {

      const img =
        product.thumbnail.replace("-I.jpg","-O.jpg");

      container.innerHTML += `
        <div class="card">

          <img src="${img}">

          <div class="info">

            <div class="title">
              ${product.title}
            </div>

            <div class="price">
              $${product.price}
            </div>

            <a
              class="btn"
              target="_blank"
              href="${product.permalink}"
            >
              Ver en Mercado Libre
            </a>

          </div>

        </div>
      `;
    });

  }catch(err){

    container.innerHTML =
      "<h2>Error cargando productos</h2>";

    console.error(err);
  }
}

loadProducts();

</script>

</body>
</html>
