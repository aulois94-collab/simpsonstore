<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simpson Store</title>

<style>

body{
margin:0;
font-family:Arial;
background:#ffd90f;
}

header{
background:#000;
color:#ffd90f;
padding:20px;
text-align:center;
}

#products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:14px;
overflow:hidden;
box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.info{
padding:15px;
}

.title{
font-size:18px;
font-weight:bold;
margin-bottom:10px;
}

.price{
font-size:22px;
color:#0a7d00;
font-weight:bold;
margin-bottom:15px;
}

.btn{
display:block;
background:#000;
color:#ffd90f;
text-align:center;
padding:12px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

</style>

</head>
<body>

<header>
<h1>🟡 Simpson Store</h1>
<p>Juguetes y coleccionables de Los Simpsons</p>
</header>

<div id="products">
<p style="padding:20px;">Cargando productos...</p>
</div>

<script>

async function loadProducts(){

const container=document.getElementById("products");

try{

const response=await fetch(
"https://api.mercadolibre.com/sites/MLM/search?seller_id=343604045&category=MLM438172&limit=50"
);

const data=await response.json();

container.innerHTML="";

data.results.forEach(product=>{

container.innerHTML+=`

<div class="card">

<img src="${product.thumbnail.replace('-I.jpg','-O.jpg')}">

<div class="info">

<div class="title">
${product.title}
</div>

<div class="price">
$${product.price}
</div>

<a class="btn"
href="${product.permalink}"
target="_blank">

Ver producto

</a>

</div>

</div>

`;

});

}catch(err){

container.innerHTML=`
<h2>
Error cargando productos 😢
</h2>
`;

console.log(err);

}

}

loadProducts();

</script>

</body>
</html>
